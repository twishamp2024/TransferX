name: Validate Linux Packaging

on:
  workflow_dispatch:
    inputs:
      ref:
        description: 'Branch, tag, or commit SHA to build and validate'
        required: false
        default: 'fix/ci-cd-pipeline'
        type: string
  push:
    branches:
      - 'validate/linux-packaging'

permissions:
  contents: read

jobs:
  validate-linux-packaging:
    name: Validate Linux Debian and Uber JAR Packaging
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.ref || 'fix/ci-cd-pipeline' }}

      - name: Record environment and checkout details
        run: |
          echo "Checked-out Commit SHA: $(git rev-parse HEAD)"
          echo "Commit subject: $(git log -1 --pretty=%s)"
          echo "Runner OS: ${{ runner.os }}"
          echo "Runner Architecture: ${{ runner.arch }}"
          uname -a

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Make Gradle wrapper executable
        run: chmod +x gradlew

      - name: Install Debian packaging dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends fakeroot dpkg

      - name: Build Linux Deb and UberJar
        run: ./gradlew :desktopApp:packageDeb :desktopApp:packageUberJarForCurrentOS --no-daemon

      - name: Validate and Stage Artifacts
        run: |
          set -euo pipefail

          mkdir -p artifacts-linux

          echo "=== 1. Validating Debian Package (.deb) ==="
          DEB_DIR="desktopApp/build/compose/binaries/main/deb"
          if [ ! -d "$DEB_DIR" ]; then
            echo "::error::Expected Debian output directory '$DEB_DIR' does not exist."
            exit 1
          fi

          DEB_COUNT=$(find "$DEB_DIR" -type f -name "*.deb" | wc -l)
          if [ "$DEB_COUNT" -eq 0 ]; then
            echo "::error::No .deb packages found in '$DEB_DIR'."
            exit 1
          fi

          for deb in "$DEB_DIR"/*.deb; do
            [ -f "$deb" ] || continue
            if [ ! -s "$deb" ]; then
              echo "::error::Debian package '$deb' is empty (0 bytes)."
              exit 1
            fi

            DEB_SIZE=$(stat -c%s "$deb")
            echo "Debian package found: $(basename "$deb") ($DEB_SIZE bytes)"

            echo "--- dpkg-deb info for $(basename "$deb") ---"
            dpkg-deb --info "$deb"

            echo "--- dpkg-deb contents sample for $(basename "$deb") ---"
            dpkg-deb --contents "$deb" | head -n 30

            cp "$deb" artifacts-linux/
          done

          echo "=== 2. Validating Uber JAR (.jar) ==="
          JAR_DIR="desktopApp/build/compose/jars"
          if [ ! -d "$JAR_DIR" ]; then
            echo "::error::Expected Uber JAR output directory '$JAR_DIR' does not exist."
            exit 1
          fi

          JAR_COUNT=$(find "$JAR_DIR" -type f -name "*.jar" | wc -l)
          if [ "$JAR_COUNT" -eq 0 ]; then
            echo "::error::No .jar files found in '$JAR_DIR'."
            exit 1
          fi

          for jar in "$JAR_DIR"/*.jar; do
            [ -f "$jar" ] || continue
            if [ ! -s "$jar" ]; then
              echo "::error::Uber JAR '$jar' is empty (0 bytes)."
              exit 1
            fi

            JAR_SIZE=$(stat -c%s "$jar")
            echo "Uber JAR found: $(basename "$jar") ($JAR_SIZE bytes)"

            echo "--- Verifying ZIP/JAR archive integrity ---"
            unzip -t "$jar" > /dev/null || { echo "::error::Corrupted JAR archive: $jar"; exit 1; }

            echo "--- Verifying desktop application entry point ---"
            if ! unzip -l "$jar" | grep -q "com/transferx/desktop/MainKt.class"; then
              echo "::error::Entry point class com/transferx/desktop/MainKt.class missing from $jar"
              exit 1
            fi
            echo "Entry point class com/transferx/desktop/MainKt.class verified."

            cp "$jar" artifacts-linux/
          done

          echo "=== 3. Validating Staging Directory ==="
          if [ -z "$(ls -A artifacts-linux 2>/dev/null)" ]; then
            echo "::error::Upload preparation directory 'artifacts-linux' is empty."
            exit 1
          fi

          STAGED_COUNT=$(ls -1 artifacts-linux | wc -l)
          echo "Total staged artifacts: $STAGED_COUNT"
          if [ "$STAGED_COUNT" -lt 2 ]; then
            echo "::error::Expected at least 2 artifacts (.deb and .jar), but found only $STAGED_COUNT."
            exit 1
          fi

          echo "=== 4. Staged Artifact Filenames, Sizes, and SHA-256 ==="
          for file in artifacts-linux/*; do
            BYTES=$(stat -c%s "$file")
            HUMAN=$(ls -lh "$file" | awk '{print $5}')
            SHA=$(sha256sum "$file" | awk '{print $1}')
            echo "Artifact: $(basename "$file") | Size: $BYTES bytes ($HUMAN) | SHA-256: $SHA"
          done

      - name: Upload Linux Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: linux-desktop-packaging
          path: artifacts-linux/*
          if-no-files-found: error
